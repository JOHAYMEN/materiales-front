<div class="login-container">

    <div class="login-card">

        <div class="logo">
            🔐
        </div>


        <h2>
            Iniciar sesión
        </h2>


        <div class="form-group">

            <label>
                Usuario
            </label>

            <input
                type="text"
                name="username"
                [(ngModel)]="loginData.username">

        </div>


        <div class="form-group">

            <label>
                Contraseña
            </label>

            <input
                type="password"
                name="password"
                [(ngModel)]="loginData.password">

        </div>


        <button
            class="btn-login"
            (click)="login()">

            Ingresar

        </button>


    </div>

</div>
