<div class="overlay">

    <div class="material-dialog">

        <div class="modal-header">

            <h2>Nuevo Material</h2>

            <button
                class="btn-close"
                (click)="cerrarModal()">
                ✕
            </button>

        </div>

        <!-- Nombre -->
        <div class="form-group">

            <label>Nombre</label>

            <input
                type="text"
                name="nombre"
                [(ngModel)]="material.nombre">

        </div>

        <!-- Descripción -->
        <div class="form-group">

            <label>Descripción</label>

            <textarea
                rows="3"
                name="descripcion"
                [(ngModel)]="material.descripcion">
            </textarea>

        </div>

        <div class="row">

            <!-- Tipo -->
            <div class="form-group">

                <label>Tipo</label>

                <input
                    type="text"
                    name="tipo"
                    [(ngModel)]="material.tipo">

            </div>

            <!-- Precio -->
            <div class="form-group">

                <label>Precio</label>

                <input
                    type="number"
                    name="precio"
                    [(ngModel)]="material.precio">

            </div>

        </div>

        <div class="row">

            <!-- Fecha Compra -->
            <div class="form-group">

                <label>Fecha compra</label>

                <input
                    type="date"
                    name="fechaCompra"
                    [(ngModel)]="material.fechaCompra">

            </div>

            <!-- Fecha Venta -->
            <div class="form-group">

                <label>Fecha venta</label>

                <input
                    type="date"
                    name="fechaVenta"
                    [(ngModel)]="material.fechaVenta">

            </div>

        </div>

        <div class="row">

            <!-- Ciudad -->
            <div class="form-group">

                <label>Ciudad</label>

                <select
                    name="ciudadId"
                    [(ngModel)]="material.ciudadId">

                    <option [ngValue]="0">
                        Seleccione...
                    </option>

                    <option
                        *ngFor="let ciudad of ciudades"
                        [ngValue]="ciudad.id">

                        {{ ciudad.nombre }}

                    </option>

                </select>

            </div>

            <!-- Estado -->
            <div class="form-group">

                <label>Estado</label>

                <select
                    name="estado"
                    [(ngModel)]="material.estado">

                    <option value="ACTIVO">
                        ACTIVO
                    </option>

                    <option value="DISPONIBLE">
                        DISPONIBLE
                    </option>

                    <option value="ASIGNADO">
                        ASIGNADO
                    </option>

                </select>

            </div>

        </div>

        <div class="modal-footer">

            <button
                class="btn-cancel"
                (click)="cerrarModal()">

                Cancelar

            </button>

            <button 
            class="btn-save"
            (click)="guardar()">

            {{ materialEditar ? 'Actualizar' : 'Guardar' }}

            </button>

        </div>

    </div>

</div>
