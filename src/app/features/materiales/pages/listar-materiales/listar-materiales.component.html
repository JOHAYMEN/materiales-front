<h2>
Listado de Materiales
</h2>


<table>

<thead>

<tr>
<th>Nombre</th>
<th>Descripcion/th>
<th>Tipo</th>
<th>Precio</th>
<th>Ciudad</th>
<th>Estado</th>
</tr>

</thead>


<tbody>

<tr *ngFor="let material of materiales">


<td>
{{material.nombre}}
</td>

<td>
{{material.descripcion}}
</td>

<td>
{{material.tipo}}
</td>


<td>
{{material.precio}}
</td>


<td>
{{material.ciudad}}
</td>

<td>
{{material.departamento}}
</td>

<td>
{{material.estado}}
</td>


</tr>


</tbody>


</table>
